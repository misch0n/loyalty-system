# Local development override.
#
#   docker compose -f compose.yml -f compose.dev.yml up
#
# Three differences from the deployed bundle, and each is a thing that must NOT
# reach production:
#   1. mailpit stands in for a real provider — every outbound mail is caught and
#      readable at http://localhost:8025 instead of being delivered.
#   2. the session cookies drop `Secure`, because a plain-HTTP dev server cannot
#      receive one at all (`env.ts` refuses this combination when NODE_ENV is
#      production, so it cannot be set here by accident and used there).
#   3. the API runs from source under `tsx watch`, and Postgres is reachable from
#      the host.

services:
  db:
    # Loopback only: a development database on a laptop is still a database.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'

  migrate:
    environment:
      NODE_ENV: development
      COOKIE_SECURE: 'false'

  api:
    # The build stage, which still has the devDependencies and `tsx`. The runtime
    # stage has neither — it is a pruned, non-root image running emitted `dist/`.
    build:
      target: build
    command: ['npm', 'run', 'dev', '--workspace', '@cafe/server']
    working_dir: /app
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      COOKIE_SECURE: 'false'
      # The Vite dev server is a second origin, so the same-origin check on
      # mutating requests needs it named. The deployed bundle is one origin and
      # leaves this empty.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      MAIL_SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: ${MAIL_FROM:-"Ckyka (dev)" <no-reply@localhost>}
      APP_URL: ${APP_URL:-http://localhost:5173}
    # Source, not the whole tree: `node_modules` stays the image's, so a host
    # install for another platform cannot shadow the container's native `argon2`.
    #
    # Editing `packages/shared` needs a manual `npm run build -w @cafe/shared` —
    # `tsx` watches what it resolves, and `@cafe/shared` resolves to `dist`.
    volumes:
      - ./packages/server/src:/app/packages/server/src:ro
      - ./packages/server/migrations:/app/packages/server/migrations:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # 8025 is the web inbox; 1025 is SMTP, published so a server run outside
      # Compose (`npm run dev -w @cafe/server`) can point at it too.
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
