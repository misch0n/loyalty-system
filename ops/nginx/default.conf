# nginx — serves the built SPA and reverse-proxies the API onto one origin.
#
# One origin is not a convenience. The session cookies are `SameSite=Lax` and the
# CSRF defence is a double-submit token plus a same-origin check comparing the
# request's `Origin` against its `Host` (`auth/guards.ts`); serving the SPA from
# somewhere else would mean listing that somewhere in `ALLOWED_ORIGINS` and
# giving up the simplest half of the boundary. So: SPA at `/`, API under `/api/`,
# same scheme, same host, same port.
#
# Listens on 8080 because the image is `nginx-unprivileged` — a non-root process
# cannot bind 80. Compose publishes it.

upstream api {
    server api:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The snapshot import is the largest thing anyone posts here.
    client_max_body_size 10m;

    # Accurate client addresses in the API's logs and rate-limit buckets. The
    # server runs with `trustProxy`, so without these every request in the café
    # would look like it came from this container.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        no-referrer always;

    # --- the SSE stream -----------------------------------------------------
    #
    # Must come before `/api/`, and must not buffer. The server already sends
    # `x-accel-buffering: no` and a keep-alive comment every 25 seconds (Phase 7),
    # but a channel that looks broken rather than merely buffered is an expensive
    # thing to debug, so this says it outright as well.
    #
    # `proxy_read_timeout` is the one that actually bites: the default is 60s and
    # an idle-but-healthy stream would be cut every minute. `Connection ''`
    # clears the hop-by-hop header so the upstream keepalive is used.
    location /api/events {
        proxy_pass http://api/events;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
        gzip off;
    }

    # --- everything else the API answers ------------------------------------
    #
    # The trailing slash on both sides is what strips the `/api` prefix: the SPA
    # calls `/api/auth/login`, the server sees `/auth/login`. Session cookies are
    # set at `Path=/`, so they travel with the SPA's own requests unchanged.
    location /api/ {
        proxy_pass http://api/;
        proxy_read_timeout 30s;
    }

    # --- the SPA ------------------------------------------------------------
    #
    # Vite emits content-hashed filenames, so assets are immutable and
    # `index.html` must never be cached — otherwise a deploy leaves browsers
    # asking for asset names that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: any path the SPA owns resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
